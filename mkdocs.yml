site_name: Tangent
site_description: >-
  Source-to-source automatic differentiation for Python - readable,
  inspectable gradient code across NumPy, JAX, TensorFlow, PyTorch,
  Keras 3, and tinygrad.
site_url: https://pedronahum.github.io/tangent/
repo_url: https://github.com/pedronahum/tangent
repo_name: pedronahum/tangent
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/chart-line-variant
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Renders :material-...: icon shortcodes (used by the landing-page cards)
  # as inline SVGs; without it they appear as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quickstart: quickstart.md
      - How Tangent Works: how-it-works.md
  - User Guide:
      - Python Language Support: features/PYTHON_FEATURE_SUPPORT.md
      - Higher-Order Derivatives: higher-order.md
      - Backends: backends.md
      - Performance & Compilation: performance.md
      - Differentiable ODEs: ode.md
      - Gradient Checkpointing: checkpointing_user_guide.md
      - Shape Checking: shape_check.md
      - Debugging Gradients: debugging.md
  - API Reference: api.md
  - Benchmarks:
      - Framework Comparison: benchmarks/FRAMEWORK_COMPARISON.md
      - Building Simulation: benchmarks/BUILDING_SIMULATION_BENCHMARK.md
      - Correctness Verification: benchmarks/CORRECTNESS_VERIFICATION.md
  - Changelog: changelog.md
  - Contributing: contributing.md

exclude_docs: |
  development/
  plans/
  fixes/
  bugs/
  optimizations/
  ORGANIZATION.md
  INDEX.md
  README.md
  GALLERY_LAUNCH.md
  COLON_SLICE_FIX_SUMMARY.md
