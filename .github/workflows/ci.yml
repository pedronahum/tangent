name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flake8
        run: pip install flake8
      # Syntax errors and undefined names only (template code legitimately
      # references the d[...] gradient sentinel and tangent/numpy at parse
      # time, hence the builtins list).
      - name: Syntax and undefined-name check
        run: >-
          flake8 . --builtins=d,tangent,numpy --count
          --exclude=tests,.venv,.venv-*,build,dist
          --select=E901,E999,F821,F822,F823 --show-source --statistics

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core dependencies only)
        run: pip install -r requirements.txt
      # TensorFlow/JAX stay absent on purpose here: the optional-backend
      # code paths must degrade to skips, not failures.
      - name: Run test suite
        run: python -m pytest tests -q

  test-full:
    # Exercises the TensorFlow, JAX, PyTorch, Keras, SymPy and visualization
    # code paths as well, so the cross-backend coverage suite
    # (tests/test_backend_coverage.py) runs against all four backends. Pinned
    # to a single interpreter to keep CI time bounded; the matrix job above
    # covers interpreter breadth.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install with all optional backends
        run: |
          pip install -r requirements.txt tensorflow jax keras sympy matplotlib networkx
          # CPU-only PyTorch wheel to keep the CI image small.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run test suite
        run: python -m pytest tests -q

  package:
    # Validates that the wheel actually builds and installs into a clean
    # environment — the test jobs above run against the source tree and would
    # not catch packaging regressions (missing packages, bad metadata).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Install wheel in a clean venv and import
        # -I (isolated mode) keeps the checkout's tangent/ source tree off
        # sys.path so the installed wheel is what actually gets imported.
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -I -c "import tangent; print(tangent.__version__)"
