name: release

# Pushing a tag `vX.Y.Z` builds the distribution, verifies it, publishes it
# to PyPI via Trusted Publishing (OIDC - no API token stored in the repo),
# and creates a GitHub Release with the artifacts attached.
# One-time PyPI setup is documented in RELEASING.md.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Tag must match the package version
        run: |
          pkg_version=$(python -c "import re; \
            src=open('tangent/__init__.py').read(); \
            print(re.search(r\"__version__ = '([^']+)'\", src).group(1))")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $pkg_version" >&2
            exit 1
          fi
      - name: Smoke-test the wheel in a clean venv
        # The test must live in a real file: tangent differentiates by reading
        # source, and `python -c` functions have none.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cat > /tmp/smoke_test.py <<'EOF'
          import tangent


          def f(x):
              return x ** 3


          assert tangent.grad(f)(2.0) == 12.0
          print('wheel OK:', tangent.__version__)
          EOF
          cd /tmp && /tmp/smoke/bin/python -I /tmp/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tangent-ad
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md) for details. Install with \`pip install tangent-ad\`."
