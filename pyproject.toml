[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI. The IMPORT name stays `tangent` (like Pillow,
# which distributes as `pillow` and imports as `PIL`): PyPI's `tangent` is
# Google's unmaintained 0.1.9 from 2017 and cannot be claimed. Because both
# distributions install a `tangent/` package, users upgrading from the old
# release must `pip uninstall tangent` first.
name = "tangent-ad"
# Version lives in tangent/__init__.py (__version__); see [tool.setuptools.dynamic].
dynamic = ["version"]
description = "Automatic differentiation using source code transformation for Python"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Google Inc.", email = "alexbw@google.com" },
]
maintainers = [
    { name = "Pedro N. Rodriguez", email = "pnrodriguezh@gmail.com" },
]
keywords = [
    "autodiff",
    "automatic-differentiation",
    "machine-learning",
    "deep-learning",
]
requires-python = ">=3.9"
dependencies = [
    "gast>=0.6.0,<0.8.0",
    "numpy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/pedronahum/tangent"
Documentation = "https://pedronahum.github.io/tangent/"
Changelog = "https://github.com/pedronahum/tangent/blob/master/CHANGELOG.md"
Repository = "https://github.com/pedronahum/tangent"
Issues = "https://github.com/pedronahum/tangent/issues"
Upstream = "https://github.com/google/tangent"

# Optional backends and features. Wheels for tf/jax/torch are platform-specific;
# on aarch64 (e.g. Grace/DGX Spark) TensorFlow and the default PyTorch wheel
# install as CPU builds.
[project.optional-dependencies]
# autograd is the reference oracle for the gradient test suite (and a niche
# runtime interop); it is not required to use tangent itself. pytest-cov powers
# the line-coverage report (see [tool.coverage] below).
test = ["pytest>=6.0", "autograd>=1.2", "pytest-cov>=4.0", "hypothesis>=6.0"]
tf = ["tensorflow>=2.16"]
jax = ["jax>=0.4.30"]
torch = ["torch>=2.0"]
keras = ["keras>=3.0"]
tinygrad = ["tinygrad>=0.14"]
# Symbolic optimizations (tangent.optimizations.algebraic_simplification and the
# straight-line coarsening prototype in tangent.optimizations.coarsening).
symbolic = ["sympy>=1.12"]
# Visualization tools (tangent.visualization).
viz = ["matplotlib>=3.7", "networkx>=3.0"]
# Documentation site (mkdocs.yml; built and deployed by .github/workflows/docs.yml).
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "pymdown-extensions>=10.0",
]
# Developer tooling: the pinned ruff the CI lint job uses (ruff format output
# can change between releases, so the version is pinned to match CI) plus
# pre-commit for the local git hooks. See the Makefile and .pre-commit-config.yaml.
dev = ["ruff==0.16.6", "pre-commit>=3.5"]
all = [
    "autograd>=1.2",
    "hypothesis>=6.0",
    "jax>=0.4.30",
    "keras>=3.0",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "pytest>=6.0",
    "pytest-cov>=4.0",
    "sympy>=1.12",
    "tensorflow>=2.16",
    "tinygrad>=0.14",
    "torch>=2.0",
]

[tool.setuptools.dynamic]
# Read statically (no import) from the literal assignment in tangent/__init__.py.
version = { attr = "tangent.__version__" }

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "build"]
# namespaces defaults to true for pyproject discovery, which would treat every
# top-level directory (docs, examples, benchmarks, ...) as a namespace package
# and bloat the wheel. Only real packages (with __init__.py) should ship.
namespaces = false

[tool.setuptools.package-data]
"*" = ["README.md", "LICENSE"]

[tool.pytest.ini_options]
filterwarnings = [
    # Third-party code (e.g. older gast/astor releases) can reference
    # deprecated ast aliases (ast.Num, ast.Str, ...) at import time. This is
    # upstream noise that cannot be fixed from here.
    "ignore:ast\\..* is deprecated:DeprecationWarning",
    # The gradient harness deliberately evaluates functions and their
    # derivatives at singular/out-of-domain inputs (sqrt/log/arcsin of
    # negatives, division by zero); correctness of those cases is asserted
    # through nan_to_num comparisons, so these NumPy numeric warnings are
    # expected probing noise, not defects. Scoped by message, not a blanket
    # RuntimeWarning ignore.
    "ignore:divide by zero encountered:RuntimeWarning",
    "ignore:invalid value encountered:RuntimeWarning",
    "ignore:overflow encountered:RuntimeWarning",
    # Template substitution can produce `if 0.0 is not None:` in generated
    # derivative code: semantically fine (a literal is never None), but
    # CPython flags the literal `is` comparison with a SyntaxWarning when the
    # generated module is compiled.
    "ignore:\"is\" with '(int|float)' literal:SyntaxWarning",
    "ignore:\"is not\" with '(int|float)' literal:SyntaxWarning",
    # Autograd is the reference oracle; its tracer warns whenever a reference
    # (second) derivative is identically zero, which the grad-of-grad matrix
    # hits ~10k times. Scoped to autograd's module so tangent's own warnings
    # stay visible.
    "ignore:Output seems independent of input.:UserWarning:autograd",
]

# Lint configuration (`ruff check`). Successor to the old flake8 CI step,
# which only caught syntax errors and undefined names (E901/E999/F821-F823);
# ruff additionally enforces the full pyflakes set (unused imports, etc.) and
# pycodestyle's deprecation warnings (W6).
[tool.ruff]
# notebooks/ contains tutorial .ipynb files with deliberately illustrative,
# non-lint-clean code. (tests/ are excluded from *linting* only, below.)
extend-exclude = ["notebooks", ".venv-*"]
# Generated-gradient template code references the `d[...]` gradient sentinel
# and the tangent/numpy modules at parse time.
builtins = ["d", "tangent", "numpy"]
# 100 columns measured as the least-churn choice against the pre-existing mix
# of upstream (2-space, ~80-col) and fork (4-space) code; see the formatting
# settlement commit. indent-width is ruff's default 4, stated explicitly
# because settling the 2-space/4-space split is the point.
line-length = 100
indent-width = 4

# Formatter configuration (`ruff format`). Formatting is enforced (CI runs
# `ruff format --check`) on the library and its tests only; docs/, examples/
# and benchmarks/ keep their hand-laid illustrative layout.
[tool.ruff.format]
exclude = ["docs/**", "examples/**", "benchmarks/**", "generate_readme_assets.py", "*.md"]
# Ruff 0.16 formats Python code blocks embedded in Markdown by default; the
# hand-laid snippets in README/docs stay as written.
# "preserve" measured meaningfully less churn than "double" (the codebase
# already leans single-quote) and keeps quoting stable in template strings
# that carry Python source.
quote-style = "preserve"

[tool.ruff.lint]
# tests/ are exercised by pytest rather than linted (parity with the old
# flake8 exclude list); they are still formatted.
exclude = ["tests/**"]
select = ["E9", "F", "W6"]
# F841 (unused local variable) is a false positive throughout the adjoint /
# tangent template DSL (tangent/grads.py, tangent/tangents.py, ...), where
# "unused" assignments are load-bearing AST templates that the source
# transformation rewrites.
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules re-export the public API.
"**/__init__.py" = ["F401", "F403"]
# Compatibility shim that re-exports the error types.
"tangent/errors.py" = ["F401"]
# Demo/benchmark scripts keep illustrative imports and f-strings; only the
# serious rules (syntax errors, undefined names, ...) apply there.
"examples/**" = ["F401", "F541", "F811"]
"benchmarks/**" = ["F401", "F541", "F811"]

# Line-coverage reporting. Run with:
#   pytest --cov --cov-report=term-missing tests/
# (requires the `test` extra, which provides pytest-cov). This measures the
# library's own line coverage, complementing the Python *language-feature*
# coverage tracked in tests/test_feature_matrix.py and
# docs/features/PYTHON_FEATURE_SUPPORT.md.
[tool.coverage.run]
branch = true
source = ["tangent"]
omit = [
    "*/tests/*",
    "*/.venv*/*",
    "*/benchmarks/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
