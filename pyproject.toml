[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tangent"
version = "0.1.9"
description = "Automatic differentiation using source code transformation for Python"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Google Inc.", email = "alexbw@google.com" },
]
keywords = [
    "autodiff",
    "automatic-differentiation",
    "machine-learning",
    "deep-learning",
]
requires-python = ">=3.9"
dependencies = [
    "gast>=0.6.0,<0.8.0",
    "numpy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/google/tangent"

# Optional backends and features. Wheels for tf/jax/torch are platform-specific;
# on aarch64 (e.g. Grace/DGX Spark) TensorFlow and the default PyTorch wheel
# install as CPU builds.
[project.optional-dependencies]
# autograd is the reference oracle for the gradient test suite (and a niche
# runtime interop); it is not required to use tangent itself.
test = ["pytest>=6.0", "autograd>=1.2"]
tf = ["tensorflow>=2.16"]
jax = ["jax>=0.4.30"]
torch = ["torch>=2.0"]
keras = ["keras>=3.0"]
# Symbolic optimizations (tangent.optimizations.algebraic_simplification and the
# straight-line coarsening prototype in tangent.optimizations.coarsening).
symbolic = ["sympy>=1.12"]
# Visualization tools (tangent.visualization).
viz = ["matplotlib>=3.7", "networkx>=3.0"]
all = [
    "autograd>=1.2",
    "jax>=0.4.30",
    "keras>=3.0",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "pytest>=6.0",
    "sympy>=1.12",
    "tensorflow>=2.16",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "build"]
# namespaces defaults to true for pyproject discovery, which would treat every
# top-level directory (docs, examples, benchmarks, ...) as a namespace package
# and bloat the wheel. Only real packages (with __init__.py) should ship.
namespaces = false

[tool.setuptools.package-data]
"*" = ["README.md", "LICENSE"]

[tool.pytest.ini_options]
filterwarnings = [
    # Third-party code (e.g. older gast/astor releases) can reference
    # deprecated ast aliases (ast.Num, ast.Str, ...) at import time. This is
    # upstream noise that cannot be fixed from here.
    "ignore:ast\\..* is deprecated:DeprecationWarning",
]
